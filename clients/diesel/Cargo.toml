[package]
name = "bench-diesel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench-diesel"
path = "src/main.rs"

[dependencies]
diesel = { version = "2.2", default-features = false, features = ["postgres_backend"] }
diesel-async = { version = "0.6", default-features = false, features = ["postgres"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
