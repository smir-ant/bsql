[package]
name = "bsql-testkit"
version.workspace = true
edition = "2024"
rust-version = "1.96"
description = "Deterministic in-memory fake PostgreSQL for testing bsql driver code with no network"
license = "MIT OR Apache-2.0"
repository.workspace = true

[dependencies]
# The testkit turns on the `testkit` feature of both drivers (for the
# `Connection::connect_fake` entry — async and sync) and core (for
# `FakeTransport` + the reply encoder). All are already resolved workspace
# members, so this adds NO new external package to the lockfile — only the
# `bsql-testkit` package itself. Both drivers are pulled so one fake backs
# either driver (the twin-driver discipline: `connect` for async,
# `connect_sync` for sync).
bsql-postgres-async = { version = "1.0.0-alpha.5", path = "../postgres/async", features = ["testkit"] }
bsql-postgres-sync = { version = "1.0.0-alpha.5", path = "../postgres/sync", features = ["testkit"] }
bsql-postgres-core = { version = "1.0.0-alpha.5", path = "../postgres/core", features = ["testkit"] }

# The sans-IO wire crate — a DIRECT edge purely to NAME the dep-free bsql-native
# PG types (`Uuid`, `Numeric`, `Timestamptz`, `Date`, `Interval`, `Json`, …) in
# `FakeValue`'s scriptable vocabulary. These are the SAME types a consumer scripts
# via `bsql::Uuid` (the umbrella re-exports proto's), so the `From` impls accept a
# consumer's value by type identity. proto is already a transitive dependency
# (via core + both drivers), so this direct edge adds NO package to the lockfile
# (`deps_pin` unchanged) and no forbidden runtime edge (proto is not sqlparser /
# bsql-build — `runtime_graph_pin` unchanged).
bsql-postgres-proto = { version = "1.0.0-alpha.5", path = "../postgres/proto" }

# Inherit the workspace FORBID floor (the two-tier lint wall).
[lints]
workspace = true

[dev-dependencies]
# The demo test uses `#[tokio::test]`. Like the async driver, the LIBRARY needs
# no runtime (`connect`/`query_raw` only `.await`, never spawn), so tokio is a
# dev-only edge — a consumer of the testkit brings its own runtime.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
