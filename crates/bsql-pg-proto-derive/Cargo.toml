[package]
name = "bsql-pg-proto-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural-macro pair-crate for bsql-pg-proto. Hosts internal-discipline derives (currently #[derive(Pristine)] for SessionParams). Mirror of the serde / serde-derive convention — runtime types live in bsql-pg-proto, derive macros live here."
keywords = ["postgres", "postgresql", "wire", "protocol", "derive"]
categories = ["database", "no-std", "rust-patterns"]

# proc-macro = true makes this a procedural-macro crate. Cannot
# export runtime types/values — only proc_macro / proc_macro_attribute /
# proc_macro_derive functions. Imports of `bsql-pg-proto` are forbidden
# (would create a cycle); generated code references `::bsql_pg_proto::*`
# paths which resolve at the user's compile site.
[lib]
proc-macro = true

[dependencies]
# Standard proc-macro toolchain. All three are ecosystem-trusted
# crates (1B+ downloads). They contain `unsafe` internally for
# token-stream manipulation; this is an audit-trust class
# "expert-domain ecosystem standard" per CREDO §11. Restricted to
# the proc-macro pair-crate — runtime crate (`bsql-pg-proto`) does
# NOT depend on syn/quote/proc-macro2 directly.
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

# DEF-244 (P11 closure, 2026-05-13): SHA-256 for content-addressed
# prepared-statement names. `prepared!("SELECT ...")` truncates
# SHA-256 of the SQL bytes to 96 bits → 24 hex chars → stmt_name
# `bsql_p_<24hex>`. 96-bit collision space is 2⁻⁹⁶ — effectively
# tier-1 for any realistic codebase (memo §7 P11).
#
# Policy-clean per DEF-META-01: `sha2` is already a workspace dep
# used by SCRAM-SHA-256 in `bsql-pg-proto` runtime. Reusing it in
# the proc-macro pair-crate is policy-clean — same RustCrypto org
# audit-trust profile, same workspace pinned major. Proc-macro
# expansion runs at compile time only; runtime users do NOT pay
# for this dep.
sha2 = { workspace = true }

[dev-dependencies]
# Integration tests need the runtime `Pristine` trait (lives in
# bsql-pg-proto). dev-dep avoids cycle: lib target only depends on
# syn/quote/proc-macro2; test target additionally pulls in
# bsql-pg-proto for trait-bound resolution of generated impls.
bsql-pg-proto = { path = "../bsql-pg-proto" }

# DEF-244 (2026-05-14): trybuild for the hostile-bypass probe
# golden harness (memo §7 P1-P12). The 12 .rs files under
# `tests/prepared_compile_fail/` ARE the load-bearing automated
# evidence for the tier-1 SQL-injection closure claim — a future
# contributor whose change relaxes any of `pub(crate) sql`, sealed
# `ParamsWriter`/`RowDecode`, content-addressed stmt_name, or
# string-literal-only macro input gets a noisy `.stderr` mismatch.
# See workspace Cargo.toml for the policy-clean justification of
# the dep.
trybuild = { workspace = true }

# DEF-233 (created 2026-05-04): pair-crate with bsql-pg-proto.
# Hosts:
#   - #[derive(Pristine)] (DEF-211 INNO-01) — generates
#     is_pristine() check for invariant types like SessionParams.
#     Lifts BS-11 broad-scope tier-3 ("contributor must remember to
#     update is_pristine when adding fields") to tier-1
#     by-construction (compiler emits the check; missed field is
#     impossible).
#
# Future entries:
#   - Other discipline-derives as needed by audit findings.
#
# This crate is intentionally minimal — proc-macro logic is
# ergonomic-discipline, not runtime-perf code. Per CREDO §4.4,
# every dep here is justified inline.
