[package]
name = "bsql-sqlite"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Lightweight SQLite driver with API-compatible Row type"
license = "MIT OR Apache-2.0"

[features]
# `n1-detect` — the diagnostics-only N+1 query detector (`conn.n1_report()`),
# the cross-backend peer of the PostgreSQL driver's detector. OFF by default: a
# production build compiles no tracker field, no query-path branch, and no
# `#[track_caller]` ABI cost — the typed verbs stay byte-identical blocking
# `fn`s. It forwards to the dependency-free `bsql-common/n1` feature, so
# `N1Report` is the SAME type across every backend — and because `bsql-common`
# has NO dependencies at all, the embedded crate keeps its zero-`bsql-postgres-core`
# boundary (no PostgreSQL / rustls tree dragged in) while sharing ONE tracker
# source instead of a hand-maintained copy.
n1-detect = ["bsql-common/n1"]

[dependencies]
# `rusqlite` — Safe Rust bindings for SQLite. `bundled` feature compiles
# SQLite from source via `libsqlite3-sys`, removing system-library
# dependency and ensuring version consistency across platforms.
# Audit-trust class: ecosystem standard (100M+ downloads), maintained
# by the rusqlite working group. Version pinned in the root
# `[workspace.dependencies]` policy block (single source of truth).
rusqlite = { workspace = true }
# `bsql-common` — the ZERO-DEPENDENCY leaf crate hosting the migration PURE
# logic (checksum / ordering / drift authority + source loader), shared with the
# PostgreSQL core so the cross-backend behaviour is ONE compiled source, not a
# hand-maintained COPY. It reaches no `sqlparser` / `bsql-build` and drags no
# PostgreSQL / rustls tree (it has NO dependencies), so the embedded crate stays
# lean and `runtime_graph_pin` stays green. The `BEGIN IMMEDIATE` apply loop
# (SQLite-only I/O) and this crate's own `MigrationError` stay here, bridged
# through the shared `migrate::plan()` seam + a local `From<migrate::Drift>`.
bsql-common = { path = "../../common" }

[dev-dependencies]
# `trybuild` — pins the EXACT compiler diagnostic for the streaming
# `query_each` no-escape wall: a `BorrowedRow` borrow that tries to escape
# the callback is a committed `.stderr` golden, so a regression that lets a
# borrowed row leak is a loud test failure. Workspace-pinned dev-only crate,
# already resolved in the lockfile; adds no new package.
trybuild = { workspace = true }

# `bsql-devgates` — the counting global allocator, used to PROVE the
# streaming `query_each` path is constant-memory (per-row allocations are
# zero, independent of row count). `publish = false`, path dependency,
# already a resolved workspace member; adds no new package and never enters
# the runtime graph (dev-dependency only).
bsql-devgates = { path = "../../../tools/devgates" }

# Inherit the workspace FORBID floor (the two-tier lint wall).
[lints]
workspace = true
