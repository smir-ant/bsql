[package]
name = "bsql-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Build-time helper for bsql's compile-checked query API: parses a consumer crate's migration DDL into a column catalog and exposes it to the query proc-macro. Used ONLY in a consumer's [build-dependencies]; never a runtime dependency of any shipped bsql crate."
keywords = ["postgres", "sql", "schema", "build", "migrations"]
categories = ["database", "development-tools::build-utils"]

[dependencies]
# `sqlparser` — the SQL grammar. BUILD-TIME ONLY. This crate is a
# build-dependency helper; nothing here is ever linked into a shipped
# library's runtime closure (the `runtime_graph_pin` gate in
# tools/devgates proves both this crate and `sqlparser` are absent from
# every shipped crate's `cargo tree -e normal` runtime graph; `deps_pin`
# pins only the package set and cannot see the build-vs-runtime
# distinction). We never hand-roll a SQL parser: faithful DDL grammar
# coverage (CREATE TABLE / ALTER TABLE column ops, quoting, type aliases)
# is expert-domain work that drifts from the spec the moment we own it.
# Apache-2.0, zero `unsafe` in its parser core. `default-features =
# false` drops the optional `serde`/`visitor` derives we do not use,
# keeping the build-time surface minimal.
#
# `features = ["recursive-protection"]` re-enables sqlparser's OWN recursion
# guard so a pathologically deep migration (thousands of nested parens /
# prefix operators / sub-queries) can NO LONGER overflow the build-script
# stack and ABORT the process (SIGABRT — uncatchable by `catch_unwind`, no
# file name, no diagnostic). It is the parser crate's expert-domain solution
# to deep recursion, which we consume rather than reinvent, and it layers
# TWO protections that together make the abort structurally impossible:
#   * `recursive`/`stacker` (the crate this feature pulls) GROWS the native
#     stack on demand across the parser's deep-recursion productions, so the
#     parse cannot overflow regardless of the build-script's initial stack
#     size — which is smaller and shallower than one might assume: Cargo
#     compiles build scripts UNOPTIMIZED (`build-override` defaults to
#     opt-level 0 → large per-frame stack use), and a Windows build script
#     runs on a 1 MiB main-thread stack. A counter alone would have to fire
#     BEFORE recursing `limit` frames deep, so a limit generous enough for
#     real migrations would overflow those stacks first; stacker decouples
#     the limit from the platform stack size.
#   * the `std` counter (`recursive-protection` implies `std`) then bounds
#     the depth at [`MAX_MIGRATION_PARSE_DEPTH`], returning a classified
#     `ParserError::RecursionLimitExceeded` (mapped to `BuildError::Parse`
#     naming the file) so an absurd nesting is rejected CLEANLY rather than
#     parsed into a giant AST.
# BUILD-TIME COST ONLY: this adds `recursive` + `stacker` (+ their build-deps
# `cc` / `psm`) to the lockfile — a reviewed `deps_pin` golden diff, justified
# in the root Cargo.toml `[workspace.dependencies]` policy block. NONE of them
# reach a shipped crate's RUNTIME closure: `bsql-build` is a build-dependency
# helper, and `runtime_graph_pin` proves `bsql-build` (and everything it pulls,
# including these) is absent from every shipped crate's `cargo tree -e normal`
# graph. So the shipped, runtime-linked artifact is byte-for-byte unchanged.
sqlparser = { workspace = true, features = ["recursive-protection"] }

# `sha2` — deterministic cryptographic SHA-256 schema fingerprinting.
# BUILD-TIME ONLY. Zero unsafe, same vetted workspace dependency.
sha2 = { workspace = true }


# `rusqlite` — safe Rust bindings to SQLite, BUILD-TIME ONLY and OPTIONAL
# (behind the `sqlite` feature). When a consumer also targets SQLite, this
# crate replays the consumer's migration DDL into an in-memory/file SQLite
# template database at build time, then — at `query!` expansion — opens it
# under a deny-all-but-readonly authorizer to cross-check that real
# SQLite's `prepare_v2` + decltype/table_info agree with the type +
# nullability lattice. It is reachable ONLY through `bsql-build` (a
# `[build-dependencies]` helper) and the build-time-only query proc-macro,
# so it never enters a shipped library's runtime closure (the
# `runtime_graph_pin` gate proves `bsql-build` itself is absent from every
# shipped crate's `cargo tree -e normal` graph). It is the SAME pinned
# package + version already resolved for `bsql-sqlite` (the shipped
# embedded driver), so it adds NO new package to the lockfile frontier.
# Extra features over the workspace `bundled` pin: `column_decltype` (read
# a prepared statement's per-result-column declared type) and `hooks` (the
# `sqlite3_set_authorizer` safe callback) — both are pure-Rust leaf
# features that pull in no further packages. We never hand-roll a SQLite
# engine: faithful SQL execution + planner introspection is exactly the
# expert-domain work the embedded engine owns.
rusqlite = { workspace = true, optional = true, features = ["column_decltype", "hooks"] }

[features]
# `sqlite` — opt in to the build-time SQLite validation backend. Pulls the
# (build-time-only) `rusqlite` edge above. A PG-only consumer leaves it off
# and never compiles SQLite. The query proc-macro enables it on this crate
# when its own `sqlite` feature is on, so the conformance entry point is
# available only where SQLite is actually targeted.
sqlite = ["dep:rusqlite"]

# Inherit the workspace FORBID floor. This is a shipped (publishable)
# helper crate — consumers add it to `[build-dependencies]` — so it
# carries the full lint wall like every other non-devgates member.
[lints]
workspace = true
