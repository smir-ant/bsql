[package]
name = "bsql"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Multi-backend SQL toolkit — PostgreSQL and SQLite"
license = "MIT OR Apache-2.0"

[features]
default = ["postgres-async", "postgres-sync", "sqlite", "tls", "webpki-roots", "scram", "md5-auth"]
postgres-async = ["dep:bsql-postgres-async"]
postgres-sync = ["dep:bsql-postgres-sync"]
# `sqlite` — the embedded SQLite driver. When `macros` is ALSO on, it turns on
# the `query!` macro's SQLite typed-runtime emission (`bsql-query-macros`'s
# `sqlite-runtime` feature), so a `query!` carrier gains its `SqliteTypedQuery`
# impl and `bsql::sqlite::Connection::query::<Q>()` executes it. The `?` keeps
# the macro edge inert when `macros` is off (the proc-macro is absent). This is
# ORTHOGONAL to `macros-sqlite` below: that is the build-time SQLite conformance
# oracle; this is the runtime driver + its typed emission.
sqlite = ["dep:bsql-sqlite", "bsql-query-macros?/sqlite-runtime"]

# `tls` — the rustls-backed encrypted PostgreSQL transport, DEFAULT-ON. Forwards
# to whichever PostgreSQL driver(s) are enabled (the `?` activates it ONLY on an
# already-enabled driver, so it pulls no driver a consumer did not ask for). With
# it OFF (`default-features = false` and not re-listed) the WHOLE ring/rustls
# subtree — ring (the single largest/longest-compiling runtime node), rustls,
# rustls-webpki, rustls-pki-types, webpki-roots, untrusted, once_cell — is dropped
# and NOT compiled, for the common localhost / unix-socket / trust-auth deployment
# that never negotiates TLS. Fail-loud when OFF: a connect that sets
# `SslMode::Require` or supplies a custom CA is a classified `DriverError::Config`,
# NEVER a silent plaintext connect the consumer thinks is encrypted. SQLite is
# unaffected (it is a local embedded file, no transport).
tls = ["bsql-postgres-async?/tls", "bsql-postgres-sync?/tls"]

# `webpki-roots` — the baked Mozilla CA trust anchors for TLS server verification,
# DEFAULT-ON. IMPLIES `tls` (baked roots without the rustls transport are
# meaningless). Forwards to whichever PostgreSQL driver(s) are enabled (the `?`
# activates it ONLY on an already-enabled driver, so it pulls no driver a consumer
# did not ask for). A consumer that verifies only against a pinned/custom CA
# (`ConnectConfig::with_ca_roots` / the `sslrootcert` DSN key) keeps TLS but drops
# the ~55-65 KB baked DER blob with `default-features = false, features = ["tls"]`.
# With no baked roots and no custom CA, a TLS connect fails CLOSED at the
# handshake, never a silent plaintext downgrade.
webpki-roots = ["tls", "bsql-postgres-async?/webpki-roots", "bsql-postgres-sync?/webpki-roots"]

# `scram` — SCRAM-SHA-256 authentication, DEFAULT-ON. Forwards to whichever
# PostgreSQL driver(s) are enabled (the `?` activates it ONLY on an already-enabled
# driver). With it OFF (`default-features = false` and not re-listed) the
# SCRAM-exclusive crypto crates (`sha2`, `hmac`, `pbkdf2`, `base64ct`,
# `cpufeatures`) leave the runtime graph; a password-bearing connect then fails
# LOUD (`DriverError::Config`), and Trust auth still works. SQLite is unaffected.
scram = ["bsql-postgres-async?/scram", "bsql-postgres-sync?/scram"]

# `md5-auth` — MD5-password authentication, DEFAULT-ON. Forwards to whichever
# PostgreSQL driver(s) are enabled (the `?` activates it ONLY on an already-enabled
# driver). With it OFF (`default-features = false` and not re-listed) `md-5` and
# its private crypto stack (7 crates) leave the runtime graph; a server that
# demands MD5 is answered with `ConnFail::UnsupportedAuthMethod` (fail-loud), and
# Trust / SCRAM auth still work. SQLite is unaffected.
md5-auth = ["bsql-postgres-async?/md5-auth", "bsql-postgres-sync?/md5-auth"]

# `n1-detect` — turn on the diagnostics-only N+1 query detector on whichever
# backend(s) are enabled (`conn.n1_report()`), across BOTH the PostgreSQL drivers
# and the SQLite driver (one cross-backend detector). OFF by default: a
# production build compiles no tracker field and no query-path branch. The `?`
# activates the feature ONLY on an already-enabled backend, so it composes with
# any backend selection and pulls no backend a consumer did not already ask for.
# Adds no external dependency (a cargo feature only).
n1-detect = [
    "bsql-postgres-async?/n1-detect",
    "bsql-postgres-sync?/n1-detect",
    "bsql-sqlite?/n1-detect",
]

# `testkit` — the deterministic in-memory fake PostgreSQL (`bsql::testkit`), for
# testing driver code with no network. NON-default: a production build never
# pulls it. It turns on the async driver's + core's `testkit` feature (the
# `Wire::Fake` transport arm), so it composes with the `postgres-async` backend.
testkit = ["dep:bsql-testkit"]

# `macros` — the compile-checked query API, reachable through this one crate.
# It re-exports the `query!` proc-macro plus every runtime primitive the
# macro's expansion names (via the hidden `__rt` module) and the user-facing
# query types (`TypedQuery`, `Rows`, `PreparedQuery`, ...). Additive and
# BACKEND-INDEPENDENT: it pulls the proc-macro + the sans-IO decode/typed-row
# primitives, not any driver, so it composes with any (or no) backend feature.
# Executing a `query!` still needs a backend (`postgres-async`/`postgres-sync`)
# to obtain a `Connection`; the macro, typed records, and `PreparedQuery` are
# available without one. `bsql-query-macros` is a PROC-MACRO (host-only,
# compile-time), so it is never linked into a consumer's runtime binary — the
# `runtime_graph_pin` gate models this with `-e no-proc-macro`.
macros = ["dep:bsql-query-macros", "dep:bsql-postgres-proto", "dep:bsql-postgres-core"]

# `macros-sqlite` — turn on the `query!` macro's build-time SQLite conformance
# cross-check. Orthogonal to the `sqlite` RUNTIME driver feature above: this is
# purely the compile-time oracle. A consumer targeting SQLite for compile-checked
# queries enables this AND, in `[build-dependencies]`, `bsql-build` with its
# `sqlite` feature so `bsql_build::emit(..)` emits the template channel the
# cross-check consumes.
macros-sqlite = ["macros", "bsql-query-macros/sqlite"]

# `test-harness` — the `#[bsql::test]` schema-per-test isolation attribute plus
# its runtime (`::bsql::__test_rt`). It pulls the `#[bsql::test]` proc-macro,
# BOTH drivers (the async driver for an `async fn` test, the sync driver for a
# plain `fn` test — the attribute is a twin over both), `bsql-postgres-core` (the
# `sql_ident` identifier validator that keeps the spliced schema name
# injection-safe), and a per-test tokio runtime (`rt` + the `net`/`time` drivers
# the async connection needs; the sync path uses no runtime). TEST-SUPPORT and
# NON-default: a production build never pulls the runtime or the harness. All
# deps are already resolved workspace members (proto/core/async/sync via the
# drivers, query-macros via the fixtures, tokio via the async driver), so this
# adds no package to the lockfile.
test-harness = [
    "dep:bsql-query-macros",
    "postgres-async",
    "postgres-sync",
    "dep:bsql-postgres-core",
    "dep:tokio",
]

[dependencies]
# `default-features = false` on the two PostgreSQL drivers so this umbrella (and
# any consumer through it) can drop core's default-on `webpki-roots` (the baked
# Mozilla CA blob). The umbrella re-exposes it via its own default-on
# `webpki-roots` feature above, which forwards to the enabled driver(s).
bsql-postgres-async = { path = "../postgres/async", optional = true, default-features = false }
bsql-postgres-sync = { path = "../postgres/sync", optional = true, default-features = false }
bsql-sqlite = { path = "../sqlite/driver", optional = true }

# Behind `testkit` only — the in-memory fake PostgreSQL. It re-enables the async
# driver's + core's `testkit` feature, so it is inert unless a consumer opts in.
bsql-testkit = { path = "../testkit", optional = true }

# Behind `macros` only. `bsql-query-macros` is a proc-macro (host-only,
# compile-time); `bsql-postgres-proto` (sans-IO decode primitives the macro's
# emitted code names) and `bsql-postgres-core` (`Rows`/`RowsBuilder`) carry the
# query-API runtime surface. All three are already resolved workspace members
# (proto/core via the drivers, query-macros via the fixtures), so `deps_pin`'s
# package SET is unchanged; these are the umbrella re-export edges.
bsql-query-macros = { path = "../query-macros", optional = true }
bsql-postgres-proto = { path = "../postgres/proto", optional = true }
# `default-features = false`: the `macros`/`test-harness` surface this pulls (the
# `sql_ident` validator, `Rows`/`RowsBuilder`) needs no TLS roots, and forcing
# core's default-on `webpki-roots` here would defeat the umbrella opt-out (Cargo
# unifies features across edges, so a default-on core edge would re-enable the
# baked blob even when the driver edges dropped it).
bsql-postgres-core = { path = "../postgres/core", optional = true, default-features = false }

# Behind `test-harness` only — the per-test runtime the `#[bsql::test]` harness
# builds. `rt` runs the current-thread runtime; `net` + `time` enable the I/O and
# timer drivers the async connection uses (`enable_all`). No `macros` (the harness
# owns the runtime with plain `#[test]`, not `#[tokio::test]`). Already resolved
# for the async driver, so this adds no package to the lockfile.
tokio = { workspace = true, optional = true, features = ["rt", "net", "time"] }

# Inherit the workspace FORBID floor (the two-tier lint wall).
[lints]
workspace = true
