[package]
name = "bsql"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.95"
description = "Multi-backend SQL toolkit — PostgreSQL and SQLite"
license = "MIT OR Apache-2.0"

[features]
default = ["postgres-async", "postgres-sync", "sqlite"]
postgres-async = ["dep:bsql-postgres-async"]
postgres-sync = ["dep:bsql-postgres-sync"]
sqlite = ["dep:bsql-sqlite"]

[dependencies]
bsql-postgres-async = { path = "../postgres/async", optional = true }
bsql-postgres-sync = { path = "../postgres/sync", optional = true }
bsql-sqlite = { path = "../sqlite/driver", optional = true }

# Inherit the workspace FORBID floor (the two-tier lint wall).
[lints]
workspace = true
