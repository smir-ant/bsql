[package]
name = "bsql-query-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macro foundation for bsql's compile-checked query API. Reads the schema catalog generated at build time by bsql-build and validates referenced table.column pairs against the real migration-replayed schema, emitting compile_error for unknown tables/columns. Reads its input only at expansion; ships no runtime types."
keywords = ["postgres", "sql", "schema", "macro", "compile-time"]
categories = ["database", "rust-patterns"]

# proc-macro = true: this crate can only export proc-macro entry points.
# It reads the build-generated catalog (via the BSQL_SCHEMA_CATALOG
# rustc-env channel the consumer's build.rs sets) at EXPANSION time. It
# has NO runtime dependencies and is never linked into a consumer's
# runtime closure beyond the macro-expansion phase.
[lib]
proc-macro = true

[dependencies]
# Standard proc-macro toolchain. Ecosystem-standard (1B+ downloads
# each); transitive `unsafe` for token-stream manipulation is bounded
# and well-audited (CREDO §11). The catalog itself is parsed with plain
# `str` operations (line-oriented text), so NO serialization dependency
# is pulled in to read it.
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

# `bsql-build` — the build-time catalog + SQL inference engine. This
# proc-macro calls `bsql_build::infer_query` at EXPANSION time to type a
# `query!` SQL literal against the migration-replayed schema, and
# `bsql_build::parse_catalog` to rebuild the catalog from the text the
# consumer's build script wrote. This is a NORMAL dependency here, but
# this crate is itself build-time-only (a `proc-macro` lib that ships no
# runtime types); the `runtime_graph_pin` gate proves `bsql-build` and
# its `sqlparser` edge stay ABSENT from every SHIPPED crate's `-e normal`
# runtime graph, because no shipped crate depends on `bsql-query-macros`.
# The emitted code references ONLY the shipped runtime decode primitives
# in `bsql-postgres-proto`, never this crate or `bsql-build`.
bsql-build = { version = "1.0.0-alpha.5", path = "../build" }

# `sha2` — content-addresses each `query!` SQL into its prepared
# statement name (a SHA-256 truncated to 96 bits). Already a workspace
# dependency (SCRAM-SHA-256 in the proto crate); reusing it here adds no
# new package to the resolved set. Build-time-only, like the rest of this
# proc-macro crate.
sha2 = { workspace = true }

[features]
# `sqlite` — turn on the build-time SQLite conformance cross-check inside
# `query!`. It enables `bsql-build`'s `sqlite` feature (the build-time-only
# `rusqlite` edge) so the proc-macro can call `verify_sqlite_conformance`
# at expansion. A consumer that also targets SQLite enables this feature
# AND calls `bsql_build::emit` (with `bsql-build`'s `sqlite` feature) in its
# `build.rs`; the cross-check then runs for every `query!`. A PG-only consumer
# leaves it off and compiles no SQLite. With the feature on: a build that
# emitted a template runs the cross-check; a build that DECLARED a SQLite
# target (the `BSQL_SQLITE_TARGET` marker) but emitted no template is a loud
# `compile_error!`, never a silent skip; a build that declared no target (e.g.
# a PostgreSQL-only sibling reached by feature unification in the same
# workspace) is unaffected. This
# crate is itself build-time-only (a proc-macro that ships no runtime
# types), so the `runtime_graph_pin` boundary is unaffected: no shipped
# crate depends on it, so `rusqlite`-at-validation never enters a shipped
# runtime graph.
sqlite = ["bsql-build/sqlite"]

# `sqlite-runtime` — emit the `SqliteTypedQuery` impl (the SQLite half of the
# typed flagship) for a SQLite-decodable `query!`. Turned on by the umbrella's
# `sqlite` runtime-driver feature (only when `macros` is also on), so the
# emitted `::bsql::__rt_sqlite::...` paths resolve against the present driver. A
# PostgreSQL-only consumer leaves it off and gets a byte-identical PostgreSQL-only
# expansion. Pulls NO dependency (the runtime emission reuses the already-inferred
# shape — it needs no SQLite validation toolchain, unlike `sqlite` above). Kept
# ORTHOGONAL to `sqlite` (build-time conformance) so a consumer can enable either
# independently.
sqlite-runtime = []

# Inherit the workspace FORBID floor (the lint wall). This crate carries
# its own stricter crate-root forbid-bundle in `src/lib.rs`, which
# coexists with the floor.
[lints]
workspace = true
