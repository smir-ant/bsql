[package]
name = "bsql-postgres-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL wire-protocol state machine — pure sync, no_std, no alloc. Sans-I/O core for bsql."
keywords = ["postgres", "postgresql", "wire", "protocol", "sans-io"]
categories = ["database", "no-std", "parser-implementations"]

# Explicit bench discovery: `benches/common.rs` is a shared fixture module
# (`mod common;`-included by the bench), NOT a bench target of its own. Turning
# auto-discovery off keeps it from being picked up as a phantom target.
autobenches = false

# `bsql-postgres-proto` is the sans-I/O kernel: pure synchronous state
# machine, zero I/O, zero allocator, zero async runtime. It runs
# inside an async wrapper (`bsql-driver-postgres`, ships in 1e),
# inside the proc-macro online client (Phase 2), or inside a
# blocking ad-hoc test — identically. See reforge.md §7.1, §13.

[features]
# DEFAULT-ON `scram`. The standard `cargo build/test -p bsql-postgres-proto`
# and `cargo test --workspace` (which use each crate's default features) keep the
# full SCRAM-SHA-256 handshake + its safety-critical zeroize/fuzz coverage. A
# consumer drops it through the driver chain (each shipped dependent takes proto
# with `default-features = false` and forwards this feature), so a
# `--no-default-features` build carries no SCRAM crypto.
default = ["scram"]

# `scram` — SCRAM-SHA-256 authentication (RFC 5802 / 7677): the whole `scram`
# module (the RustCrypto composition), the `Credentials::ScramPassword` variant,
# the four connecting-state SCRAM variants + their dispatch, the `ConnFail::Scram`
# leaf class, and the SCRAM secret-zeroization drop witnesses. DEFAULT-ON. With it
# OFF the SCRAM-EXCLUSIVE crypto crates — `sha2`, `hmac`, `pbkdf2`, `base64ct`,
# `cpufeatures` (a `sha2` edge) — drop from the runtime graph (`md-5`, kept
# unconditional for MD5 auth, keeps the shared `digest`/`subtle`/`generic-array`
# stack alive, so ONLY these SCRAM-only crates drop — not the audit's optimistic
# ~12). `getrandom` drops only when `tls` is also off (rustls/ring keeps it).
# Trust auth still works OFF; a driver given a password with SCRAM off fails LOUD
# at connect (`DriverError::Config`), and a Trust client hitting a SCRAM-demanding
# server already fails with `ConnFail::UnsupportedAuthMethod` — never a panic or a
# silent auth failure. Optional deps → the golden lock is unchanged (Cargo.lock
# unions all optional deps; `deps_pin` stays green).
scram = [
    "dep:sha2",
    "dep:hmac",
    "dep:pbkdf2",
    "dep:base64ct",
    "dep:subtle",
    "dep:getrandom",
]

# No `bench-hooks` feature. A naive shape would gate `#[doc(hidden)] pub fn`
# test/bench hooks behind a cargo feature that downstream users could enable in
# their Cargo.toml (tier-3 by-discipline; CREDO §1 absolute-safety violation
# surface). Instead the benches drive the PUBLIC engine surface only — a session
# over an in-process scripted `Transport` — and reach a fresh, primed engine per
# iteration through `criterion::iter_batched` (setup builds + primes the engine
# UNTIMED; the routine measures the single timed round-trip). Tier closure: the
# feature is physically absent, so there is no leak surface to enable.

[dependencies]
heapless = { workspace = true }
# SCRAM-SHA-256 crypto — OPTIONAL, behind the default-on `scram` feature. Each is
# named only by the `scram`-gated `scram` module, so with SCRAM off they leave the
# runtime graph. `md-5` (below) is UNCONDITIONAL (MD5 auth) and keeps the shared
# `digest`/`generic-array`/`subtle` stack resolved, so `subtle` stays in the lock
# even when its only DIRECT edge (SCRAM's `ConstantTimeEq`) is gated out.
sha2 = { workspace = true, optional = true }
md-5 = { workspace = true }
hmac = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
zeroize = { workspace = true }
simdutf8 = { workspace = true }

# `getrandom` — OS entropy for the SCRAM client nonce (never `SystemTime`-seeded).
# OPTIONAL, behind the default-on `scram` feature: SCRAM is its only proto use, so
# with SCRAM off it leaves the runtime graph (unless `tls` keeps it via rustls/
# ring). The no_std / no_alloc contract holds — getrandom is a thin syscall
# wrapper over OS entropy.
getrandom = { workspace = true, optional = true }

# `panic = "abort"` is set at the workspace level for `release` so
# unwinding cannot occur in production. The forbid-bundle in
# `lib.rs` rules out panic-able expressions at compile time, so
# the abort path is unreachable by construction.

[dev-dependencies]
# SCRAM integration tests (`tests/startup_spec.rs`) build synthetic
# server-first / server-final message fixtures, which require
# base64-encoding salt + signature bytes. Pre-audit the tests
# imported the crate-internal `base64_encode_to_buf` — which forced
# that function to be `pub` for test access alone. Post-audit the
# function is `pub(crate)` and tests call `base64ct::Base64::encode`
# directly via this dev-only entry, closing the "pub for tests"
# visibility anti-pattern.
base64ct = { workspace = true }

# `criterion` — ns/op statistical bench harness for the `hot_paths` bench.
# Dev-only; the bench target compiles with std while the lib stays no_std. See
# workspace `Cargo.toml` for the tool-choice rationale (criterion kept over
# divan/manual: its transitive tail is already trimmed to a handful of dev-only
# packages via `default-features = false`, and the asm/bench scripts speak its
# `--bench <name>` / baseline vocabulary directly).
criterion = { workspace = true }

# `trybuild` — golden compile-fail harness for the sole-path injection
# seam: proves an EXTERNAL crate cannot struct-literal-construct
# `SimpleQuery` / `Parse` (the `sql` field is `pub(crate)` → E0451), so the
# only construction route is the explicit `::new` seam. Dev-only.
trybuild = { workspace = true }

# `bsql-devgates` — dev-only harness hosting the workspace's only
# `unsafe`: the counting `#[global_allocator]` installed by the deterministic
# allocation gates (`engine_*_alloc`, `engine_read_ramp_spec`) and the
# raw-memory `probe_bytes` shared by the zeroize-verification tests so they
# audit ONE unsafe read instead of five copies.
bsql-devgates = { path = "../../../tools/devgates" }

# This crate KEEPS its stricter crate-root forbid-bundle in `src/lib.rs`
# (the full no_std panic/index/arith/cast wall, including
# `#![forbid(unsafe_code)]`). `lints.workspace = true` adds the workspace
# FORBID floor on top — they coexist (a double-forbid of the same lint is
# not a conflict). This crate opts out of the tier-4 `disallowed_methods`
# ledger at its crate root (it uses the sanctioned dead-arm `.unwrap_or*`
# shape under that stricter wall, not silent data fallbacks).
[lints]
workspace = true

# `harness = false` disables the default libtest bench runner: the `hot_paths`
# bench provides its own `criterion_main!` entry point. It uses the public
# engine API only (a session over the in-process scripted transport in
# `benches/common.rs`), so it needs no crate features.
[[bench]]
name = "hot_paths"
harness = false
