[package]
name = "bsql-postgres-sync"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Sync PostgreSQL driver built on bsql-pg-proto sans-IO state machine"
license = "MIT OR Apache-2.0"

[features]
# DEFAULT-ON. Forwards the core's `tls` + baked-Mozilla-roots defaults; a
# localhost / unix-socket / trust-auth deployment drops the ENTIRE ring/rustls
# subtree with `default-features = false`.
default = ["tls", "webpki-roots", "scram", "md5-auth"]

# `tls` — forward the core's default-on rustls-backed encrypted transport. With
# it OFF (`default-features = false`) the whole ring/rustls subtree is dropped
# and this driver's `build_tcp_wire` sends no SSLRequest probe: `SslMode::Prefer`
# connects plaintext, while `SslMode::Require` or a custom CA is a fail-loud
# `DriverError::Config` at connect (never a silent plaintext connect). This
# driver names no `rustls` type of its own (it composes `core::tls`), so the
# feature only forwards to core — it pulls no extra direct dependency.
tls = ["bsql-postgres-core/tls"]

# `webpki-roots` — forward the core's default-on baked Mozilla CA trust anchors
# (`ConnectConfig::with_ca_roots` supplies custom roots regardless of this flag).
# DEFAULT-ON; IMPLIES `tls` (baked roots without the rustls transport are
# meaningless). `default-features = false, features = ["tls"]` keeps TLS but
# drops the ~55-65 KB baked DER blob for a consumer that verifies only against a
# pinned/custom CA. See the core crate's `webpki-roots` feature.
webpki-roots = ["tls", "bsql-postgres-core/webpki-roots"]

# `testkit` — expose `Connection::connect_fake`, which drives the full
# startup/query engine path over the in-memory `core::testkit::FakeTransport`
# instead of a socket. OFF by default: it only turns on the core `testkit`
# feature (the `Wire::Fake` arm) and adds a feature-gated constructor; the real
# TCP/TLS `connect` path and every other method are untouched. The
# consumer-facing `bsql-testkit` crate turns this on.
testkit = ["bsql-postgres-core/testkit"]

# `n1-detect` — the diagnostics-only N+1 query detector. OFF by default: a
# production build gains no `Connection` field, no query-path branch, and no
# `#[track_caller]` ABI cost — the typed verbs stay byte-identical. When on, it
# turns on the core `n1-detect` feature (the `N1Tracker` type) and records each
# typed verb's `#[track_caller]` call site. Adds no external dependency.
n1-detect = ["bsql-postgres-core/n1-detect"]

# `scram` — forward the default-on SCRAM-SHA-256 authentication. DEFAULT-ON. With
# it OFF the SCRAM-exclusive crypto crates leave the runtime graph; a
# password-bearing connect then fails LOUD (`DriverError::Config`) at
# `Self::connect`, and Trust auth still works. Forwards to core only — no extra
# direct dependency.
scram = ["bsql-postgres-core/scram"]

# `md5-auth` — forward the default-on MD5-password authentication. DEFAULT-ON.
# With it OFF, `md-5` and its private crypto stack (7 crates) leave a
# `--no-default-features` runtime graph; a server that demands MD5 is answered
# with `ConnFail::UnsupportedAuthMethod` (fail-loud). Forwards to core only — no
# extra direct dependency.
md5-auth = ["bsql-postgres-core/md5-auth"]

[dependencies]
# `default-features = false` so the umbrella (and any consumer) can drop core's
# default-on `webpki-roots` (the baked Mozilla CA blob); the driver re-exposes it
# through its own default-on `webpki-roots` feature above.
bsql-postgres-core = { version = "1.0.0-alpha.1", path = "../core", default-features = false }
# `default-features = false` so proto's default-on `scram` is droppable through
# the chain (re-enabled via the `scram` feature above); without it proto's default
# would force SCRAM on for the whole graph.
bsql-postgres-proto = { version = "1.0.0-alpha.1", path = "../proto", default-features = false }
# `socket2` — SAFE borrowed-fd access to enable TCP keepalive on the connected
# `std::net::TcpStream` (dead-peer detection for IDLE pooled connections), the
# blocking twin of the async driver's use. Already resolved in the workspace
# graph (via the async driver's tokio), so this adds no new crate to the lockfile
# (deps_pin unchanged). Used through `SockRef` + `TcpKeepalive` only — no `unsafe`
# reaches this crate.
socket2 = { workspace = true }
# No direct `rustls`: this driver composes the engine's sans-IO
# `core::tls::TlsTransport` (shared with the async driver) and names no `rustls`
# type of its own, so TLS rides the core `tls` feature — the whole rustls subtree
# drops with `default-features = false`.

# Inherit the workspace FORBID floor (the two-tier lint wall). The pool's
# mutex/condvar poison-recovery fallbacks carry scoped allows in
# `src/pool.rs`; the live integration test carries one in `tests/`.
[lints]
workspace = true

[dev-dependencies]
# Turn ON core's OFF-BY-DEFAULT `test-scenarios` feature for this driver's TEST
# build only — its `--ignored` live suite (`tests/sync_live.rs`) invokes
# `bsql_postgres_core::define_sql_scenario_tests!`. `default-features = false`
# adds ONLY `test-scenarios` (the driver's own feature forwarding governs core's
# tls/scram), and being dev-only keeps the macro out of a downstream consumer's
# core.
bsql-postgres-core = { path = "../core", default-features = false, features = ["test-scenarios"] }

# `trybuild` — golden compile-fail harness PINNING the transaction-guard tier-1
# guarantee: it PROVES `tx.begin/commit/rollback/transaction/close/reset_session`
# on the borrowing `Transaction` guard are each E0599 (a future refactor that
# re-added a lifecycle verb, or reverted the closure arg to `&mut Connection`,
# would silently downgrade tier-1 → tier-4 with every other test still green).
# Already a resolved workspace dependency (used by core's / proto's compile-fail
# goldens), so this dev edge adds NO package to the lockfile (`deps_pin`
# unchanged) and is excluded from every shipped crate's runtime graph
# (`runtime_graph_pin` unchanged — dev edges are not `-e normal`).
trybuild = { workspace = true }
