[package]
name = "bsql-postgres-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural-macro pair-crate for bsql-postgres-proto. Hosts internal-discipline derives (currently #[derive(Pristine)] for SessionParams). Mirror of the serde / serde-derive convention — runtime types live in bsql-postgres-proto, derive macros live here."
keywords = ["postgres", "postgresql", "wire", "protocol", "derive"]
categories = ["database", "no-std", "rust-patterns"]

# proc-macro = true makes this a procedural-macro crate. Cannot
# export runtime types/values — only proc_macro / proc_macro_attribute /
# proc_macro_derive functions. Imports of `bsql-postgres-proto` are forbidden
# (would create a cycle); generated code references `::bsql_pg_proto::*`
# paths which resolve at the user's compile site.
[lib]
proc-macro = true

[dependencies]
# Standard proc-macro toolchain. All three are ecosystem-trusted
# crates (1B+ downloads). They contain `unsafe` internally for
# token-stream manipulation; this is an audit-trust class
# "expert-domain ecosystem standard" per CREDO §11. Restricted to
# the proc-macro pair-crate — runtime crate (`bsql-postgres-proto`) does
# NOT depend on syn/quote/proc-macro2 directly.
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
# Integration tests need the runtime `Pristine` trait (lives in
# bsql-postgres-proto). dev-dep avoids cycle: lib target only depends on
# syn/quote/proc-macro2; test target additionally pulls in
# bsql-postgres-proto for trait-bound resolution of generated impls.
bsql-postgres-proto = { path = "../proto" }

# trybuild for the Pristine derive's compile-fail golden harnesses.
# The `.rs` files under `tests/pristine_unsupported_compile_fail/` and
# `tests/def280e_compile_fail/` ARE the load-bearing automated evidence
# for the derive's tier-1 rejection contract — a future change that
# relaxed an unsupported-field-shape or sensitive-borrow-escape rejection
# gets a noisy `.stderr` mismatch. See workspace `Cargo.toml` for the
# policy-clean justification of the dep.
trybuild = { workspace = true }

# Pair-crate with `bsql-postgres-proto`. Hosts:
#   - `#[derive(Pristine)]` — generates `is_pristine()` checks for
#     invariant types like `SessionParams`. Lifts broad-scope tier-3
#     ("contributor must remember to update `is_pristine` when
#     adding fields") to tier-1 by-construction (compiler emits the
#     check; missed field is impossible).
#
# Future entries: other discipline-derives as needed.
#
# This crate is intentionally minimal — proc-macro logic is
# ergonomic-discipline, not runtime-perf code. Per CREDO §4.4,
# every dep here is justified inline.

# Inherit the workspace FORBID floor. This crate KEEPS its stricter
# crate-root forbid-bundle in `src/lib.rs`; the floor coexists with it.
# It opts out of the tier-4 `disallowed_methods` ledger at its crate
# root (it uses the sanctioned `try_from(..).unwrap_or(SAT)` dead-arm
# shape under its own stricter forbid-bundle, not silent data fallbacks).
[lints]
workspace = true
