[package]
name = "bsql-postgres-async"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.95"
description = "Async PostgreSQL driver built on bsql-pg-proto sans-IO state machine"
license = "MIT OR Apache-2.0"

[features]
# `testkit` — expose `Connection::connect_fake`, which drives the full
# startup/query engine path over the in-memory `core::testkit::FakeTransport`
# instead of a socket. OFF by default: it only turns on the core `testkit`
# feature (the `Wire::Fake` arm) and adds a feature-gated constructor; the real
# TCP/TLS `connect` path and every other method are untouched. The
# consumer-facing `bsql-testkit` crate turns this on.
testkit = ["bsql-postgres-core/testkit"]

[dependencies]
bsql-postgres-core = { path = "../core" }
bsql-postgres-proto = { path = "../proto" }
# LIB feature set is the minimal I/O surface the driver compiles against:
# `net` (TcpStream), `io-util` (Async{Read,Write}Ext), `time` (timeouts +
# the recv_notification read deadline), `sync` (the pool's Semaphore/Mutex).
# `macros` / `rt` / `rt-multi-thread` are deliberately NOT here — the library
# never spawns tasks or runs a runtime, so it must not force a runtime flavor
# on consumers. Those features live in `[dev-dependencies]` below for the
# `#[tokio::test]` suites only. Proven by `cargo check -p bsql-postgres-async`.
#
# No `tokio-rustls`: TLS is the engine's sans-IO `core::tls::TlsTransport`
# (rustls::unbuffered, ring-explicit), shared with the blocking driver — the
# async driver wraps `tokio::net::TcpStream` in that transport, never the
# tokio-rustls glue. `rustls` itself is not a direct dependency: the driver
# composes `core::tls` / `core::ssl` and names no rustls type.
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }

# Inherit the workspace FORBID floor (the two-tier lint wall). The pool's
# mutex poison-recovery fallbacks carry scoped allows in `src/pool.rs`.
[lints]
workspace = true

[dev-dependencies]
# The async integration/unit suites use `#[tokio::test]`, which expands to
# a `#[test]` fn that builds and blocks on a runtime — that needs the
# `macros` (the attribute), `rt` (current-thread runtime), and
# `rt-multi-thread` (the multi-thread flavor some tests select) features.
# The library itself needs NONE of these (verified by compiling the lib
# with the trimmed feature set above), so keeping them dev-only means a
# consumer of this driver is free to pick any runtime / runtime flavor.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
