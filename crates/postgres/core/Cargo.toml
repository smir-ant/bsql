[package]
name = "bsql-postgres-core"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.95"
description = "Shared types and Session for bsql PostgreSQL drivers (async + sync)"
license = "MIT OR Apache-2.0"

[features]
# DEFAULT-ON. The `tls` subtree (rustls + ring + webpki-*) and the baked Mozilla
# roots are the out-of-the-box encrypted transport; a localhost / unix-socket /
# trust-auth deployment that never does TLS drops the ENTIRE ring/rustls subtree
# with `default-features = false`.
default = ["tls", "webpki-roots", "scram"]

# `tls` — the rustls-backed encrypted transport: the whole `tls` module
# (`TlsTransport`, `shared_client_config`, the custom-CA parsers), the `ssl`
# SSLRequest-probe module, and the `Wire::Tls` arm. DEFAULT-ON. With it OFF
# (`default-features = false`) the entire ring/rustls dependency subtree — ring
# (the single largest/longest-compiling runtime node), rustls, rustls-webpki,
# rustls-pki-types, webpki-roots, untrusted, once_cell — is dropped and NOT
# compiled, for the common localhost / unix-socket / trust-auth deployment that
# never negotiates TLS. Fail-loud when OFF: a connect that sets
# `SslMode::Require` or supplies a custom CA (`with_ca_roots` / `sslrootcert` /
# `PGSSLROOTCERT`) is a classified `DriverError::Config` at connect (the driver's
# `build_tcp_wire`), NEVER a silent plaintext connect the consumer thinks is
# encrypted; `SslMode::Prefer` connects plaintext with the SSLRequest probe
# compiled out, and `is_encrypted()` is then always `false`. Optional dep, so the
# golden lock is unchanged (Cargo.lock unions all optional deps; `deps_pin` stays
# green).
tls = ["dep:rustls"]

# `webpki-roots` — bake the Mozilla CA trust anchors (`TLS_SERVER_ROOTS`, ~55-65
# KB of DER) into the default client TLS root store (`tls::shared_client_config`).
# DEFAULT-ON so a public-CA PostgreSQL server verifies out of the box. IMPLIES
# `tls` (baked roots without the rustls transport are meaningless — the store is
# consumed only by `tls::shared_client_config`). A consumer that verifies ONLY
# against a pinned/custom CA (`ConnectConfig::with_ca_roots` / the `sslrootcert`
# DSN key) or the system store can drop the baked blob while keeping TLS with
# `default-features = false, features = ["tls"]`; with no baked roots AND no
# custom CA, a TLS connect then fails CLOSED at the handshake (an empty
# trust-anchor set trusts no server cert), never a silent plaintext downgrade.
# Optional dep, so the golden lock is unchanged (`deps_pin` stays green).
webpki-roots = ["tls", "dep:webpki-roots"]

# `testkit` — the in-memory fake PostgreSQL backend (`testkit::FakeTransport`)
# plus the `Wire::Fake` arm that plugs it behind the engine's transport seam.
# OFF by default: a production consumer that never uses the fake pays nothing
# and does not compile the extra arm, so the real plaintext/TLS transport path
# stays byte-identical. Additive and dependency-free (the reply encoder is built
# over the already-present proto wire vocabulary). The consumer-facing
# `bsql-testkit` crate turns this on.
testkit = []

# `n1-detect` — the diagnostics-only N+1 query detector (`n1::N1Tracker`,
# `n1::N1Report`). OFF by default: a production build compiles no tracker type,
# so the drivers' `Connection` gains no field and no query-path branch. Additive
# and dependency-free (the tracker is a fixed inline window + a `Vec` of reports,
# no external crate). Both drivers turn this on through their own `n1-detect`.
n1-detect = []

# `scram` — forward the sans-IO kernel's default-on SCRAM-SHA-256 authentication.
# DEFAULT-ON. With it OFF the SCRAM-exclusive crypto crates (`sha2`, `hmac`,
# `pbkdf2`, `base64ct`, `cpufeatures`) leave the runtime graph; a password-bearing
# connect then fails LOUD at the driver, and Trust auth still works. Forwards to
# `bsql-postgres-proto` only — this crate pulls no extra dependency of its own.
scram = ["bsql-postgres-proto/scram"]

[dependencies]
# `default-features = false` so this crate (and the drivers/umbrella above it) can
# DROP proto's default-on `scram` feature; the SCRAM crypto is re-enabled through
# the `scram` feature above. Without this, proto's default would force SCRAM on
# for the whole graph, defeating the drop.
bsql-postgres-proto = { path = "../proto", default-features = false }
# `rustls` — OPTIONAL, behind the default-on `tls` feature. The pure-Rust TLS
# stack (ring provider) the `tls` / `ssl` modules build on. With `tls` OFF the
# whole rustls + ring subtree is neither resolved into a runtime graph nor
# compiled. Optional dep → the golden lock is unchanged (Cargo.lock unions all
# optional deps; `deps_pin` stays green — it pins the resolved SET, which the
# all-features union already contains).
rustls = { workspace = true, optional = true }
# `webpki-roots` 1.0 ships the Mozilla CA root bundle as the
# `TLS_SERVER_ROOTS` slice consumed in `src/tls.rs`. The 0.26 line is a
# thin re-export shim over 1.0.x, so depending on 0.26 dragged BOTH
# 0.26.11 and 1.0.x into the lock; pinning 1.0 directly collapses the
# graph to a single entry (same `TLS_SERVER_ROOTS` API). OPTIONAL and behind
# the default-on `webpki-roots` feature so a custom/pinned-CA-only consumer can
# drop the ~55-65 KB baked DER blob with `default-features = false`.
webpki-roots = { workspace = true, optional = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
# `bsql-devgates` — dev-only harness hosting the workspace's only `unsafe`:
# the counting `#[global_allocator]` used by the `tls_alloc_gate` integration
# test to prove the inbound-decrypt cost is bounded (does not grow per record)
# and the outbound `write` path is 0-alloc. Already a resolved workspace
# member, so this dev edge adds no package to the lockfile (`deps_pin`
# unchanged) and is excluded from every shipped crate's runtime graph
# (`runtime_graph_pin` unchanged — dev edges are not `-e normal`).
bsql-devgates = { path = "../../../tools/devgates" }

# `bsql-postgres-proto` — already a NORMAL dependency (line 27) of this crate;
# re-declared here as a dev edge purely so the `decoder_fuzz` integration test
# (a separate crate) can name proto's public decoders directly. Integration
# tests see only the crate-under-test plus its dev-dependencies, never the
# crate's normal deps. Because proto is already resolved, this adds NO package
# to the lockfile (`deps_pin` unchanged) and is a dev edge excluded from every
# shipped crate's runtime graph (`runtime_graph_pin` unchanged — not `-e normal`).
bsql-postgres-proto = { path = "../proto" }

# `trybuild` — golden compile-fail harness for the `SafeIdent` / `SafeTable`
# structural injection guard: it PROVES a splice site cannot take a raw `&str`
# and that the newtypes cannot be fabricated bypassing their `validate`
# constructor (both are compile errors). Already a resolved workspace dependency
# (used by proto's compile-fail goldens), so this dev edge adds NO package to the
# lockfile (`deps_pin` unchanged) and is excluded from every shipped crate's
# runtime graph (`runtime_graph_pin` unchanged — dev edges are not `-e normal`).
trybuild = { workspace = true }

# Inherit the workspace FORBID floor (the two-tier lint wall). The two
# legitimate tier-4 fallback sites in this crate (a Display default
# severity label, a sole-ctor dead arm) carry scoped allows in `src/`.
[lints]
workspace = true
