[package]
name = "bsql-postgres-core"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.95"
description = "Shared types and Session for bsql PostgreSQL drivers (async + sync)"
license = "MIT OR Apache-2.0"

[dependencies]
bsql-postgres-proto = { path = "../proto" }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
zeroize = { version = "1", default-features = false, features = ["zeroize_derive", "alloc"] }

# `trybuild` — golden compile-fail harness for the `Col` identifier
# vocabulary. The closed identifier/type universe and the typed-eq guard
# are tier-1 compiler invariants; their durable documentation (Part III-C)
# is a locked `.stderr` set, not a runtime test. Drift in a diagnostic
# (e.g. a contributor weakening a seal or the `as_sql` return type) trips
# the golden mismatch instead of silently passing.
[dev-dependencies]
trybuild = { workspace = true }
