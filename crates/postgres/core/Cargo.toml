[package]
name = "bsql-postgres-core"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.95"
description = "Shared types and Session for bsql PostgreSQL drivers (async + sync)"
license = "MIT OR Apache-2.0"

[features]
# `testkit` — the in-memory fake PostgreSQL backend (`testkit::FakeTransport`)
# plus the `Wire::Fake` arm that plugs it behind the engine's transport seam.
# OFF by default: a production consumer that never uses the fake pays nothing
# and does not compile the extra arm, so the real plaintext/TLS transport path
# stays byte-identical. Additive and dependency-free (the reply encoder is built
# over the already-present proto wire vocabulary). The consumer-facing
# `bsql-testkit` crate turns this on.
testkit = []

[dependencies]
bsql-postgres-proto = { path = "../proto" }
rustls = { workspace = true }
# `webpki-roots` 1.0 ships the Mozilla CA root bundle as the
# `TLS_SERVER_ROOTS` slice consumed in `src/ssl.rs`. The 0.26 line is a
# thin re-export shim over 1.0.x, so depending on 0.26 dragged BOTH
# 0.26.11 and 1.0.x into the lock; pinning 1.0 directly collapses the
# graph to a single entry (same `TLS_SERVER_ROOTS` API).
webpki-roots = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
# `bsql-devgates` — dev-only harness hosting the workspace's only `unsafe`:
# the counting `#[global_allocator]` used by the `tls_alloc_gate` integration
# test to prove the inbound-decrypt cost is bounded (does not grow per record)
# and the outbound `write` path is 0-alloc. Already a resolved workspace
# member, so this dev edge adds no package to the lockfile (`deps_pin`
# unchanged) and is excluded from every shipped crate's runtime graph
# (`runtime_graph_pin` unchanged — dev edges are not `-e normal`).
bsql-devgates = { path = "../../../tools/devgates" }

# Inherit the workspace FORBID floor (the two-tier lint wall). The two
# legitimate tier-4 fallback sites in this crate (a Display default
# severity label, a sole-ctor dead arm) carry scoped allows in `src/`.
[lints]
workspace = true
