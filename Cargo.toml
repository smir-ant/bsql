[workspace]
resolver = "3"
members = [
    "crates/bsql",
    "crates/postgres/proto",
    "crates/postgres/derive",
    "crates/postgres/core",
    "crates/postgres/async",
    "crates/postgres/sync",
    "crates/sqlite/driver",
    # Dev-only harness; `publish = false`. Hosts the workspace's only
    # `unsafe` (counting allocator + memory probe) and deliberately does
    # NOT inherit the forbid floor — see `[workspace.lints]` below.
    "tools/devgates",
]

[workspace.package]
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smir-ant/bsql"

# Crates are added one-by-one as the rebuild rolls out. The
# workspace currently hosts `bsql-pg-proto` (sans-I/O wire-protocol
# state machine) + `bsql-pg-proto-derive` (proc-macro).

# ============================================================================
# Two-tier lint wall.
# ============================================================================
#
# TIER A — the floor below. Inherited by every SHIPPED crate (all seven:
# bsql, postgres-{proto,derive,core,async,sync}, sqlite) via
# `lints.workspace = true` in its `Cargo.toml`. Only `tools/devgates`
# (dev-only, `publish = false`) opts out entirely — it hosts the
# workspace's sole `unsafe`.
#
# The floor has TWO levels, and the split is load-bearing:
#
#   * `forbid` band — the un-bypassable core. Under `forbid` a future
#     `#[allow(<floor lint>)]` is a hard `E0453` compile error ("overruled
#     by previous forbid"), so these lints cannot be silenced anywhere in
#     a floor-inheriting crate. Used for lints with ZERO violations across
#     ALL targets (lib + tests + benches) AND no legitimate need for a
#     scoped exception. The KEYSTONE `allow_attributes_without_reason` is
#     here: it makes every `#[allow]` in the workspace carry an explicit
#     `reason`, so the `deny` band below stays tamper-evident (a bare
#     `#[allow(clippy::disallowed_methods)]` that would silently reopen the
#     tier-4 ledger now fails to compile).
#
#   * `deny` band — production fortress lints that legitimately fire in
#     TEST / BENCH code (`panic`, `unwrap_used`, `expect_used`,
#     `unwrap_in_result`, plus the `disallowed_methods` ledger). A failed
#     `unwrap()` in a test IS the loud failure signal — the opposite of a
#     silent production fallback — so these are scoped to non-test code via
#     `allow-{unwrap,expect,panic,indexing-slicing}-in-tests = true` in
#     `clippy.toml`. They MUST be `deny`, not `forbid`: clippy implements
#     the in-tests carve-out by injecting an internal `#[allow(...)]` into
#     `#[test]`/`#[cfg(test)]` context, and a `forbid` level turns that
#     injected allow into `E0453`. The same applies to the per-helper
#     reasoned `#![allow(...)]` that integration-test helper fns require
#     (Cargo compiles `tests/*.rs` helper fns WITHOUT `cfg(test)`, so the
#     carve-out misses them — each such helper / bench module carries a
#     scoped `#![allow(clippy::panic, reason = "...")]`). Under `deny`,
#     production stays un-panicked while the keystone forces every test
#     exception to state, in code, why it is safe.
#
# Why `unsafe_code` is NOT in this floor, despite being the headline
# safety lint:
#   - A `forbid` floor forbids ANY later level-setting of the lint,
#     including `#[allow]`, anywhere in a floor-inheriting crate (E0453).
#   - Five dev-only zeroize-verification test crates in
#     `crates/postgres/proto/tests/*_staleness_spec.rs` +
#     `scram_zeroize_miri_spec.rs` probe memory AFTER a value is dropped.
#     That read is inherently `unsafe` at the CALL SITE (it dereferences a
#     caller-held raw pointer into freed/dropped storage); there is no
#     SOUND safe wrapper (a safe fn taking `*const u8` would let any safe
#     caller read arbitrary memory). So those crates keep a reasoned
#     `#![allow(unsafe_code, reason = "...")]` (the keystone requires the
#     reason), which a `forbid` floor would turn into E0453.
#   - Therefore `unsafe_code` is enforced PER-CRATE instead: every shipped
#     lib carries `#![forbid(unsafe_code)]` at its own crate root (so all
#     PRODUCTION code is unsafe-free and un-bypassable within the lib), and
#     the only `unsafe` left in the whole workspace is consolidated into
#     `tools/devgates` — the bench's counting allocator and the single
#     audited memory-probe the five tests now share. It is promoted into
#     this floor the moment those tests can be expressed unsafe-free.
#
# How proto / derive relate to the floor (NOT an opt-out like devgates):
# both INHERIT the full Tier-A floor via `lints.workspace = true`, AND
# keep their own STRICTER crate-root forbid-bundle in `src/lib.rs` (the
# no_std panic / index / arith / cast wall + `#![forbid(unsafe_code)]`).
# A double-forbid of the same lint is not a conflict, so the two coexist.
# Their ONLY divergence from the floor is a single crate-root reasoned
# `#![allow(clippy::disallowed_methods, reason = "...")]` that opts out of
# the `deny`-level tier-4 LEDGER (not the floor): under the stricter
# whole-crate forbid-bundle the `try_from(..).unwrap_or(SAT)` /
# `slice.get(..).unwrap_or(&[])` shape is the sanctioned dead-arm, not a
# silent data fallback, so a per-site ledger there would be noise.
#
# TIER B — heavier lints that CURRENTLY have violations are intentionally
# kept OUT of this floor (forcing them now would, e.g., demand documenting
# hundreds of public items that later engine slices rewrite or delete —
# documenting corpses). They are rolled into the floor per-slice as
# modules stabilize. Counts below are measured @ this base across
# `--workspace --all-targets` with every crate-root forbid-bundle
# OVERRIDDEN to `warn` (i.e. the naive count of what would fire if the
# floor adopted the lint with no per-crate suppression; proto/derive
# already forbid most of these at their crate root, so the production
# total is far lower):
#   missing_docs (~275: fields/methods/modules/etc.),
#   let_underscore_must_use (~99), arithmetic_side_effects (38),
#   as_conversions (18), unreachable (17), indexing_slicing (~21 outside
#   the in-tests carve-out), let_underscore_drop (22),
#   missing_debug_implementations (13), cast_possible_truncation (~5),
#   cast_possible_wrap (~5), float_cmp (2). (`panic`, `unwrap_used`,
#   `expect_used`, `unwrap_in_result` are NO LONGER deferred — they are in
#   the `deny` band of the floor above, production-scoped via the
#   in-tests carve-outs.) Plus, although ZERO-violation now, two lints
#   stay out because a forbid floor forbids the explicit level that code
#   we don't own or want to touch already sets:
#   `unused_variables` (the `#[derive(Zeroize, ZeroizeOnDrop)]` macro emits
#   an internal `#[allow(unused_variables)]` → E0453) and
#   `missing_copy_implementations` (proto's crate root sets
#   `#![warn(missing_copy_implementations)]`; warn-after-forbid → E0453).

[workspace.lints.rust]
# Zero-violation-now, conflict-free safety/correctness rust lints.
# Dead lifetime parameters — zero-violation now.
unused_lifetimes = "forbid"
# Edition-2024 pattern-binding change that can silently alter semantics.
rust_2024_incompatible_pat = "forbid"

[workspace.lints.clippy]
# Zero-violation-now clippy safety/correctness lints.
# `mem::forget` skips Drop — a real way to leak secret-zeroizing types.
mem_forget = "forbid"
todo = "forbid"
unimplemented = "forbid"
cast_sign_loss = "forbid"
integer_division = "forbid"
# KEYSTONE — makes every `#[allow]` in a floor-inheriting crate carry an
# explicit `reason = "..."`. Without it a future bare
# `#[allow(clippy::disallowed_methods)]` would silently reopen the tier-4
# ledger hole below; with it, that bare allow is a compile error. So the
# whole wall becomes tamper-evident: any suppression must state, in code,
# the constraint that makes it safe. `forbid`, so it cannot itself be
# disabled. Zero-violation now (every existing allow already has a reason).
allow_attributes_without_reason = "forbid"
# PRODUCTION PANIC-CLASS FORTRESS. These ban every panic-able expression
# in production (non-test) code; a panic in shipped code is the tier-4
# "happens not to fail" class the project bans. Test / bench code
# legitimately panics — a failed `unwrap()` in a test IS the loud failure
# signal — so the `allow-{unwrap,expect,panic,indexing-slicing}-in-tests =
# true` switches in `clippy.toml` scope these to non-test code only.
#
# Level is `deny`, NOT `forbid`, and the distinction is load-bearing:
# clippy implements the `*-in-tests` carve-out by injecting an internal
# `#[allow(clippy::panic)]` (etc.) into `#[test]`/`#[cfg(test)]` context.
# A `forbid` level turns that injected allow into a hard `E0453`
# ("allow … incompatible with previous forbid"), so `forbid` + the
# carve-out cannot coexist — and the same applies to the per-helper-module
# reasoned `#![allow(...)]` that integration-test helper fns (which are NOT
# in `#[test]` context, so the carve-out misses them) require. `deny` keeps
# production un-panicked while letting the keystone above (every override
# carries a `reason`) make each test exception greppable and justified.
# Measured: zero PRODUCTION (non-test, non-helper) violations across all
# shipped crates (proto/derive already forbid these at their stricter
# crate root).
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
# Additional zero-violation safety lints (measured 0 across --workspace
# --all-targets). These have no legitimate test-context exception, so they
# stay at `forbid`:
#   `unwrap_in_result` — an `unwrap`/`expect` inside a fn that already
#       returns Result/Option is a panic where a `?` would propagate. (Has
#       the same in-tests carve-out as unwrap/expect, so it is `deny`.)
#   `lossy_float_literal` — a float literal whose value the type cannot
#       represent exactly is silently rounded (a quiet correctness drift).
#   `char_lit_as_u8` — `'x' as u8` truncates non-ASCII chars silently;
#       byte literals (`b'x'`) are the unambiguous spelling.
#   `exit` — `process::exit` skips Drop (so secret-zeroizing types never
#       scrub) and bypasses normal error propagation.
#   `wildcard_dependencies` — a `*` version requirement defeats the
#       pinned-dependency policy (a transitive bump can land unreviewed).
unwrap_in_result = "deny"
lossy_float_literal = "forbid"
char_lit_as_u8 = "forbid"
exit = "forbid"
wildcard_dependencies = "forbid"
# TIER-4 LEDGER (silent-fallback ban). `unwrap_used` does NOT catch the
# `.unwrap_or*` family; the banned methods are listed in the root
# `clippy.toml`. This level is `deny`, NOT `forbid`, on purpose: the
# ledger needs scoped `#[allow(clippy::disallowed_methods, reason=...)]`
# overrides at the handful of legitimate non-silent fallback sites
# (mutex poison-recovery, a Display default label, a sole-ctor dead arm).
# `forbid` would make those reasoned exceptions impossible.
disallowed_methods = "deny"

[workspace.dependencies]
# Every addition is justified inline:
#   - Why we can't write it ourselves in < 200 LoC.
#   - `default-features = false` to minimise surface.
#   - Pinned version, never `*`.
# See reforge.md §4.4 / Part XI for the policy.

# `heapless` — bounded, stack-allocated `Vec<T, N>` / `String<N>` /
# `FnvIndexMap<K, V, N>`. `bsql-pg-proto` is `no_std` and forbids
# `alloc`; the only way to build a runtime-sized buffer (the read
# buffer that absorbs incoming wire bytes) is `heapless::Vec`.
# Writing a 250-LoC bounded ringbuffer ourselves duplicates a
# 6-year-stable upstream that ships zero transitive deps with
# `default-features = false`.
heapless = { version = "0.9.2", default-features = false }

# `sha2` — SHA-256 hash used by SCRAM-SHA-256 authentication (RFC 5802).
# Expert-domain cryptography: DEF-META-01 mandates we never hand-roll
# this. RustCrypto org, audited. `default-features = false` for no_std.
sha2 = { version = "0.10", default-features = false }

# `md-5` — MD5 hash used by PG's legacy AuthenticationMD5Password method
# (sub-code 5). Expert-domain cryptography: never hand-roll a hash
# function, even one as broken-for-new-uses as MD5 — drift between
# our implementation and the spec is the principal risk, not the
# algorithmic weakness (which the PG protocol owns, not us).
# RustCrypto, same audit-trust profile as `sha2` / `hmac` /
# `pbkdf2`. `default-features = false` for no_std.
#
# **Security note**: MD5 is cryptographically broken for collision-
# resistant uses but PG's auth protocol specifically does NOT depend
# on collision resistance (the salt+rehash construction provides only
# weak protection against passive observation; offline cracking with
# modern GPUs is fast). MD5 password auth is included for compatibility
# with legacy on-prem PG <= 13 deployments that haven't migrated to
# SCRAM. The driver wrapper (Phase 1e) is responsible for warning
# operators and preferring SCRAM where available.
md-5 = { version = "0.10", default-features = false }

# `hmac` — HMAC-SHA-256 used by SCRAM to derive keys and signatures.
# Same rationale as `sha2`: expert-domain, DEF-META-01 binding.
hmac = { version = "0.12", default-features = false }

# `pbkdf2` — PBKDF2-HMAC-SHA-256 key derivation for SCRAM salted
# passwords (RFC 7677). Timing-safe implementation from RustCrypto.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# `base64ct` — **constant-time** RFC 4648 base64 for SCRAM wire
# messages. Rationale: the SCRAM ClientProof is derived from the user's
# password; its base64 encoding is one step in the authentication
# sequence where a data-dependent branch or table-lookup-time
# could in principle leak password-correlated bits via timing.
# `base64` v0.22's `STANDARD` engine is essentially constant-time
# in practice (cache-line-sized lookup table) but does not
# formalise it; `base64ct` is branchless by construction and
# audited by the RustCrypto working group. DEF-META-01 (policy 9:
# never hand-roll expert-domain code) — RustCrypto is the
# sanctioned source for cryptographic primitives.
# `default-features = false` keeps it `no_std` + `no_alloc`.
base64ct = { version = "1", default-features = false }

# `subtle` — constant-time comparison for SCRAM server-signature
# verification. Prevents timing side-channels on secret-derived
# digests. DEF-META-01 scope (cryptographic primitive).
subtle = { version = "2", default-features = false }

# `zeroize` — secure memory scrubbing on drop for password and key
# buffers. The `zeroize_derive` feature provides `#[derive(Zeroize,
# ZeroizeOnDrop)]` for struct fields. DEF-META-01 scope.
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }

# `getrandom` — cryptographically secure random bytes for SCRAM
# client nonce. OS-provided entropy; never hand-rolled, never
# SystemTime-seeded (expert-domain cryptography).
getrandom = { version = "0.2", default-features = false }

# --- TLS / driver runtime deps (single source of version truth) ---
# Hoisted here so every consuming crate inherits one pinned version via
# `dep = { workspace = true }`. A version bump happens in exactly one
# place, and the `deps_pin` gate fails the build on any accidental drift.

# `rustls` — pure-Rust TLS 1.2/1.3 stack for the optional encrypted
# transport. `default-features = false` drops the `aws-lc-rs` default
# crypto provider (C/asm build dependency) in favour of the pure-Rust
# `ring` provider; `std` for the OS-backed config builder, `tls12` for
# legacy-PG compatibility. Expert-domain cryptography (DEF-META-01) —
# never hand-rolled. Both the async and sync drivers share this pin.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }

# `webpki-roots` — the Mozilla CA trust anchors (`TLS_SERVER_ROOTS`)
# loaded into the rustls root store. Pinned to the 1.0 line: the 0.26
# line is a thin re-export shim over 1.0.x, so pinning 1.0 keeps the
# dependency graph collapsed to a single entry (no shim duplication).
webpki-roots = { version = "1.0", default-features = false }

# `tokio` — async runtime. A LIBRARY must not dictate the consumer's
# runtime flavor, so the LIB feature set here is the minimal I/O surface
# the async driver actually compiles against: `net` (TcpStream), `io-util`
# (AsyncReadExt/AsyncWriteExt), `time` (connect/read timeouts), `sync`
# (the pool's Semaphore/Mutex). The `macros` + `rt` + `rt-multi-thread`
# features are needed ONLY by the `#[tokio::test]` suites and are added in
# the async crate's own `[dev-dependencies]`, NOT forced on consumers.
tokio = { version = "1", default-features = false }

# `tokio-rustls` — glues rustls onto tokio's async I/O for the encrypted
# async transport. `ring` provider to match the `rustls` pin above
# (no aws-lc-rs C toolchain dependency).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# `rusqlite` — safe Rust bindings to SQLite for the embedded backend.
# The `bundled` feature compiles SQLite from source (via
# `libsqlite3-sys`), removing the system-library dependency and pinning
# the engine version across platforms. Ecosystem standard (100M+
# downloads), maintained by the rusqlite working group.
rusqlite = { version = "0.33", features = ["bundled"] }

# `simdutf8` — SIMD-accelerated UTF-8 validation. Drives
# `<&str as FromPgText>::from_pg_text` for text-format column bytes
# coming off the wire. `core::str::from_utf8` is scalar bytewise;
# `simdutf8::basic::from_utf8` uses lane-wise vector shuffles +
# masks (5-10× throughput improvement on aarch64 NEON; equivalent
# scalar fast-path on no-SIMD targets). SIMD validators are
# expert-domain — `simdutf8` is the canonical audited
# implementation (used by `serde_json`, `sonic-rs`, `simd-json`).
# Bytewise behaviour parity with `core::str::from_utf8` is
# documented + property-tested upstream.
#
# `default-features = false` for no_std. `aarch64_neon` opt-in
# adds NEON path (mandatory in aarch64; no runtime detection
# needed). x86 SIMD path requires `std` (cpuid detection via
# `is_x86_feature_detected!`); in no_std we fall through to
# simdutf8's scalar fast-path (still faster than `core::str::from_utf8`).
simdutf8 = { version = "0.1", default-features = false, features = ["aarch64_neon"] }

# `criterion` — benchmark harness. Dev-only dependency;
# benches compile with std enabled (criterion requires std) while
# the lib stays no_std. Provides statistical sampling (bootstrap
# CI), outlier detection, and regression tracking across runs.
# Pinned to 0.5 (last pre-1.0 with stable API); upgrade in lockstep
# with criterion's semver.
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

# `trybuild` — `compile_fail` golden harness for the `prepared!`
# proc-macro's hostile-bypass probes P1–P12 (and the broader set of
# compile-fail probes across the workspace).
# Pins the EXACT compiler diagnostic for each forbidden user pattern
# (e.g., `error[E0451]: field 'sql' of struct 'PreparedQuery' is
# private`). A future contributor whose change perturbs the
# diagnostic gets a noisy `.stderr` mismatch — forces them to either
# fix the regression OR explicitly update the golden, both forms of
# audit trail.
#
# Without trybuild the closure claim "12 hostile probes compile-
# rejected" has no automated drift detection: a contributor who
# accidentally promotes `pub(crate) sql` to `pub sql` (or removes
# a sealed super-trait) gets ZERO signal until a hostile user files
# a CVE. That violates the tier-1-by-construction discipline because
# the enforcement isn't tested.
#
# Audit-trust class: ecosystem standard for proc-macro testing
# (160M+ downloads; used by serde / tokio / clap / anyhow). Dev-only
# dependency — no runtime cost to library consumers. Default features
# acceptable (the crate is simple; `default-features = false` doesn't
# meaningfully shrink it for dev-deps).
trybuild = { version = "1" }

# Proc-macro toolchain used ONLY by `bsql-pg-proto-derive`
# (proc-macro pair-crate for `bsql-pg-proto`). `bsql-pg-proto`
# itself never depends on these — they live entirely behind the
# pair-crate boundary. Audit-trust class: **expert-domain ecosystem
# standard** (1B+ downloads each, embedded in the Rust toolchain
# ecosystem; transitive `unsafe` for token-stream manipulation is
# bounded and well-audited). Pinned majors per CREDO §4.4.
syn = { version = "2", default-features = false, features = ["proc-macro", "derive", "parsing", "printing"] }
quote = { version = "1", default-features = false }
proc-macro2 = { version = "1", default-features = false, features = ["proc-macro"] }

# --- Build profiles ---
#
# Consumer profiles apply when bsql is used as a library. These
# workspace profiles only affect in-repo builds (tests, benches).

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
# `panic = "abort"` vs `"unwind"` architectural decision.
#
# CONSEQUENCE for secret-bearing types (Password, ScramSession,
# SecretDigest, Sensitive<T>):
#   - `ZeroizeOnDrop` IS the primary zeroize mechanism in this crate.
#   - Under `panic = "abort"`, Drop does NOT run on panic paths — the
#     process aborts immediately, bypassing unwinding. Any secret sitting
#     in a stack frame at abort time persists in the abort-frozen process
#     memory until kernel reap.
#   - `panic = "unwind"` would run Drop on every panic, closing this
#     gap. The cost: larger binary size (unwind tables), slight runtime
#     overhead per function with destructors, more complex cancellation
#     semantics in async contexts, and cross-language FFI panic-safety
#     concerns (Rust panics unwinding into C++/Obj-C code is UB).
#
# CURRENT STANCE:
#   Accept `panic = "abort"` for the crash-safety + binary-size +
#   FFI-safety benefits. Defense-in-depth for secrets:
#     (a) `Zeroizing<T>` scope-guards on every secret-bearing local
#         binding in SCRAM crypto composition — these drop on normal
#         scope exit which happens BEFORE the function can panic
#         past the compute point.
#     (b) `WriteBuf::clear()` / `ReadBuf::clear()` zero-on-clear +
#         Drop impls scrub wire-level secret residue on normal
#         reuse/teardown paths.
#     (c) `Password` / `ScramSession` / `SecretDigest` Drop impls fire
#         on every state transition via `mem::replace` / `mem::take`
#         (normal control flow).
#
# What PANIC = ABORT can leak:
#   - Password/signature bytes sitting in a function's stack frame at
#     the INSTANT of an abort. Rare in practice because:
#       * Most crypto ops don't panic (forbid-bundle enforces: no
#         unwrap/expect/panic/indexing/arithmetic in crate code).
#       * Third-party crypto deps (sha2, hmac, pbkdf2, base64ct) are
#         documented infallible or return Result — no panics.
#     But theoretically: an OOM in heapless Vec extend could panic,
#     the abort would freeze that stack frame with secret bytes.
#
# ALTERNATIVE (future design discussion):
#   Option 1: switch to `panic = "unwind"` in release (accept size/FFI
#             trade-off).
#   Option 2: keep abort + add `mlock(2)` + `madvise(MADV_DONTDUMP)`
#             for secret-bearing memory pages (requires std-level OS
#             hook, not no_std-clean).
#   Option 3: keep abort + add a pre-abort hook via `std::panic::set_hook`
#             that walks known-secret regions and zeroes them before
#             calling `abort()`. Complex, foot-gun-heavy.
#
# Option 1 is the cleanest fix; option 2 is best-in-class but requires
# std. For now: keep abort, document the limitation honestly, trust
# the defense-in-depth of explicit Zeroizing scope guards.
panic = "abort"
strip = "symbols"
