[package]
name = "bsql-query-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Fixture consumer exercising the bsql compile-checked query chain end-to-end: a real build.rs calling bsql-build over a migrations/ directory, then query! typing SQL against the build-generated catalog. Hosts the freshness tests. Never published."

# Not a shipped crate; it exists only to prove the migrations -> catalog
# -> proc-macro chain (including no-stale-cache freshness) works for a
# REAL consumer that has the build.rs.
publish = false

[features]
# `n1-detect` (non-default) — turns on the N+1 detector on the drivers AND the
# `#[bsql::test]` harness, for the LIVE N+1 witness (`tests/n1_detect_live.rs`,
# `#[ignore]`). Kept OFF by default so a plain `cargo {clippy,test} --workspace`
# builds the drivers feature-OFF (feature unification would otherwise force the
# detector on for the whole workspace); the witness file `#![cfg]`s itself out
# when off. Enable with `--features n1-detect` (which, being `--workspace`-wide,
# also lights up every driver/umbrella `n1-detect` for the feature-on gate run).
# Adds no external package: test-harness pulls tokio/drivers already resolved for
# this fixture's dev-deps; n1-detect pulls nothing external.
n1-detect = ["bsql/test-harness", "bsql/n1-detect"]

[dependencies]
# The umbrella crate, and the ONLY runtime dependency of this fixture's own
# code (`src/lib.rs`). Reaching the flagship `query!` through `bsql` alone —
# `bsql::query!`, whose expansion names only `::bsql::__rt::` paths — is the
# whole point this fixture proves: a real consumer hand-wires nothing. The
# build-time `bsql-build` / `sqlparser` stay in `[build-dependencies]`, and
# `bsql-query-macros` (a host-only proc-macro pulled by the `macros` feature)
# never enters this crate's runtime closure. `default-features = false` keeps
# the runtime surface minimal — just the compile-checked query API, no driver.
bsql = { path = "../../crates/bsql", default-features = false, features = ["macros"] }

[build-dependencies]
# BUILD-DEPENDENCY ONLY. This is the exact placement a real consumer
# uses: bsql-build parses this crate's migrations/ into the catalog at
# build time. Because it lives in [build-dependencies] (not
# [dependencies]), `sqlparser` never enters this crate's runtime closure.
bsql-build = { path = "../../crates/build" }

[dev-dependencies]
# trybuild drives the compile-fail goldens (unknown column rejected) and
# the freshness transitions (a removed column makes a once-valid
# reference fail to compile).
trybuild = { workspace = true }

# `bsql-postgres-proto` — DEV-ONLY. The fixture's own consumer code
# (`src/lib.rs`) reaches everything through `bsql` alone; these WHITE-BOX
# tests deliberately poke sans-IO internals (`params::ParamsWriter`,
# `WriteBuf`, `engine::*`, the seal's `prepared::new_prepared_query`) that a
# real consumer never touches, so they name the proto crate directly. Already
# a resolved workspace member (pulled at runtime by `bsql`'s `macros` feature
# and by the driver dev-deps), so this dev edge adds no package to the
# lockfile (`deps_pin` unchanged) and is excluded from every shipped crate's
# runtime graph (`runtime_graph_pin` unchanged — dev edges are not `-e normal`).
bsql-postgres-proto = { path = "../../crates/postgres/proto" }

# `bsql-devgates` — dev-only harness hosting the workspace's counting
# allocator. The `query!` allocation test installs it as the test
# binary's `#[global_allocator]` to prove the borrowed decode of an
# all-fixed row allocates nothing. Dev-only; never in any runtime closure.
bsql-devgates = { path = "../devgates" }

# The drivers — DEV-ONLY, for the live `query!` round-trip tests (`#[ignore]`,
# need local PG) that exercise the full pipeline macro -> TypedQuery ->
# query_params -> prebuffer -> typed decode, and for the `Rows<Q>` escape-wall
# trybuild golden (which names `bsql_postgres_sync::Rows`). Both are already
# resolved workspace members, so these dev edges add NO package to the lockfile
# (`deps_pin` unchanged) and are excluded from every shipped crate's runtime
# graph (`runtime_graph_pin` unchanged — dev edges are not `-e normal`).
bsql-postgres-sync = { path = "../../crates/postgres/sync" }
bsql-postgres-async = { path = "../../crates/postgres/async" }

# `bsql-testkit` — DEV-ONLY, for the flagship-against-the-fake demo: a real
# `query!` typed query runs over the in-memory fake PostgreSQL with NO network,
# proving the fake's binary DataRow bytes decode into the typed record. It
# enables the `testkit` feature on both drivers transitively (feature
# unification), so `connect_fake` is reachable. Already a resolved workspace
# member, so this dev edge adds no package to the lockfile (`deps_pin`
# unchanged) and is excluded from every shipped crate's runtime graph
# (`runtime_graph_pin` unchanged — dev edges are not `-e normal`).
bsql-testkit = { path = "../../crates/testkit" }

# `bsql-postgres-core` — DEV-ONLY, for the OFFLINE no-swallow test that drives a
# `RowsBuilder` with hand-built (malformed + well-formed) row bytes and asserts
# `Rows::iter()` yields a per-row `Err(DecodeError)` without a panic. Already
# resolved transitively via the drivers, so this dev edge adds no package to the
# lockfile (`deps_pin` unchanged) and is excluded from every shipped crate's
# runtime graph (`runtime_graph_pin` unchanged).
bsql-postgres-core = { path = "../../crates/postgres/core" }

# `tokio` — DEV-ONLY, for the `#[tokio::test]` async live round-trip. The
# `macros`/`rt`/`rt-multi-thread` features are exactly the set the async
# driver's own `#[tokio::test]` suite enables, so feature unification adds no
# package to the lockfile.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

# `criterion` — DEV-ONLY ns/op harness for the `typed_decode` bench. This is the
# home of the const-offset all-fixed decode fast path vs the per-cell path,
# because that decode is EMITTED by the `query!` macro (it needs this crate's
# build-catalog env, which the proto crate has no access to). Already a resolved
# workspace dependency, so this dev edge adds no package to the lockfile
# (`deps_pin` unchanged) and never enters any shipped runtime graph.
criterion = { workspace = true }

# Inherit the workspace FORBID floor / lint wall like every other
# non-devgates member.
[lints]
workspace = true

# `harness = false`: the `typed_decode` bench provides its own `criterion_main!`.
[[bench]]
name = "typed_decode"
harness = false
