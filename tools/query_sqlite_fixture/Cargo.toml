[package]
name = "bsql-query-sqlite-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Fixture consumer exercising the bsql SQLite build-time validation backend end-to-end: a real build.rs replays a SQLite-portable migrations/ directory into both the PostgreSQL catalog AND an in-memory→OUT_DIR SQLite template DB, then query! validates each query under a deny-all-but-readonly authorizer and cross-checks that real SQLite's prepare_v2 + decltype/table_info agree with the inference lattice. Hosts the SQLite conformance + scan-on-toggle trybuild gate. Never published."

# Not a shipped crate; it exists only to prove the SQLite build-time
# validation chain (template DB -> readonly authorizer -> decltype/lattice
# conformance -> scan-on-toggle) works for a REAL consumer that targets
# SQLite. Mirrors `tools/query_fixture` (the PostgreSQL-only twin).
publish = false

[dependencies]
# The umbrella crate, and the ONLY dependency of this fixture's own code.
# `macros` reaches the flagship `query!` (its PostgreSQL expansion names only
# `::bsql::__rt::` paths); `macros-sqlite` turns ON the macro's build-time
# SQLite conformance cross-check (host/expansion only); `sqlite` pulls the
# embedded SQLite RUNTIME driver AND turns on the macro's SQLite typed-runtime
# emission (`::bsql::__rt_sqlite::...`), so a `query!` carrier gains its
# `SqliteTypedQuery` impl and `bsql::sqlite::Connection::query::<Q>()` executes
# it. This is the exact wiring a real SQLite-targeting consumer uses:
# `["macros", "macros-sqlite", "sqlite"]` plus the `[build-dependencies]`
# catalog+template generator below. The build-time SQLite VALIDATION toolchain
# (bsql-build, sqlparser) stays host-only — `bsql-query-macros` is a proc-macro
# — while the RUNTIME driver (rusqlite, via `sqlite`) is deliberately in the
# runtime closure now, because this fixture EXECUTES typed queries.
bsql = { path = "../../crates/bsql", default-features = false, features = ["macros", "macros-sqlite", "sqlite"] }

[build-dependencies]
# BUILD-DEPENDENCY ONLY, with the `sqlite` feature on: bsql-build both
# replays this crate's migrations/ into the PostgreSQL catalog AND replays
# the SAME migrations into a SQLite template database in OUT_DIR. Because it
# lives in [build-dependencies], neither sqlparser nor rusqlite enters this
# crate's runtime closure.
bsql-build = { path = "../../crates/build", features = ["sqlite"] }

[dev-dependencies]
# trybuild drives the SQLite gate: a conforming query compiles; an unknown
# table/column, invalid SQL, a lattice/SQLite type-or-nullability
# disagreement, and an unacknowledged full-scan-on-toggle each fail to
# compile with a pinned diagnostic.
trybuild = { workspace = true }

# Inherit the workspace FORBID floor / lint wall like every other
# non-devgates member.
[lints]
workspace = true
