[package]
name = "bsql-corpus"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Dev-only replay corpus: a Rust-native typed corpus of PostgreSQL wire transcripts replayed through an observable-I/O Adapter seam. Pins engine behaviour against committed ObservedRun goldens — the same corpus pins one engine now and any future re-implementation later, because the Adapter/ObservedRun types name ONLY observable values (client wire bytes + public outcomes), never an internal engine type."

# Never published. This crate is a verification harness, not a shipped
# artifact: it depends on the engine ONLY through public surface and the
# observable types it defines outlive the engine internals they replay
# against (a later engine rewrite deletes internal types but keeps this
# corpus green). It is intentionally absent from the `runtime_graph_pin`
# SHIPPED_CRATES list and never appears in any shipped crate's runtime
# graph.
publish = false

[dependencies]
# Build client request frames + server reply frames from the public wire
# vocabulary (`wire::TAG_*`, `parse_header`) and the public `PreparedQuery`
# (minted via `new_prepared_query`) for the binary-param path. The engine adapter
# (test-side, `#[path]`-included) also drives the public sans-IO
# `engine::{ConnectingEngine, ActiveEngine}` + verb surface via `poll_once`
# over a synchronous scripted `Transport` — no async runtime is needed.
bsql-postgres-proto = { path = "../../crates/postgres/proto" }

# Inherit the workspace FORBID floor (the two-tier lint wall). This dev
# crate needs no `unsafe`, so it keeps `#![forbid(unsafe_code)]` at
# its own root like every shipped crate. The fixture-builder helpers
# panic on malformed synthetic input (the sanctioned loud-fail signal,
# not a production fallback); each carries a scoped reasoned allow.
[lints]
workspace = true
